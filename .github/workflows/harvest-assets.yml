# .github/workflows/harvest-assets.yml
# =====================================================================
# Pulls hourly history for assets other than Bitcoin and commits it, so the
# model can be tested zero-shot on instruments it was never trained on.
#
# This job exists because the exchange APIs are unreachable from the
# development container -- the egress proxy returns 403 on bitstamp.net and
# api.exchange.coinbase.com -- while the repository's own fetch-data cron has
# been pulling Bitstamp hourly from a runner without trouble for days. The
# network boundary is the container's, not the internet's, so the fetch is done
# where it is already permitted and the result is committed for offline use.
#
# Deliberately NOT on a schedule. This is a one-off research dataset, not a
# live feed; re-run it by hand when the evaluation window needs extending.
name: harvest-assets

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Comma-separated symbols (eth,sol,xrp,ltc,ada,link,doge)'
        default: 'btc,eth,sol,xrp,ltc'
      days:
        description: 'Days of history per asset'
        default: '3300'
  push:
    paths:
      - 'model/eval/harvest.py'
      - '.github/workflows/harvest-assets.yml'

permissions:
  contents: write

# Serialise runs, but do NOT cancel the one already going. cancel-in-progress
# looks right and is not: re-running an older failed run counts as "newest" and
# kills a newer, fixed run that was already most of the way through a harvest.
# That happened here -- a re-run of the pre-fix workflow cancelled the fixed
# one at 09:24 and then failed in exactly the way the fix addressed. Now that
# the commit step re-parents onto the current tip, overlapping runs are
# harmless, so queueing is strictly safer than pre-empting.
concurrency:
  group: harvest-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime
        run: pip install --quiet -r model/serve/requirements-ci.txt

      - name: Harvest
        run: |
          python -m model.eval.harvest \
            --symbols "${{ github.event.inputs.symbols || 'btc,eth,sol,xrp,ltc' }}" \
            --days "${{ github.event.inputs.days || '3300' }}"

      - name: Report what landed
        run: |
          ls -la data/assets/ || echo "no bundles produced"
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          for f in sorted(Path("data/assets").glob("*_history.parquet")):
              h = pd.read_parquet(f)
              span = (h.hour_ts.max() - h.hour_ts.min()) / 86400
              print(f"{f.name:<28} {len(h):>6} hours  {span:>5.0f} days  "
                    f"{f.stat().st_size/1024:>6.0f} KB")
          PY

      # Insurance. The 3300-day harvest takes over an hour, and a run whose
      # COMPUTE succeeded and whose COMMIT failed lost all of it -- exactly what
      # happened at 05:35Z. kronos-eval survived the same failure only because
      # it happened to upload an artifact first.
      - name: Upload bundles as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asset-bundles
          path: data/assets/*.parquet
          if-no-files-found: warn

      - name: Commit bundles
        run: |
          set -euo pipefail
          BR="${{ github.ref_name }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stash ONLY the bundles this run actually wrote.
          #
          # Copying every *.parquet would also pick up assets not in --symbols
          # and assets whose harvest failed, and restoring those after
          # re-parenting would silently revert a concurrent update to an
          # unrelated bundle and commit the reversion as part of "the harvest".
          # `git diff --name-only` names exactly what this run changed.
          mkdir -p /tmp/bundles
          git diff --name-only -- data/assets/ > /tmp/changed.txt || true
          git ls-files --others --exclude-standard -- data/assets/ >> /tmp/changed.txt || true
          sort -u /tmp/changed.txt -o /tmp/changed.txt
          echo "bundles produced by this run:"; cat /tmp/changed.txt
          while read -r f; do [ -n "$f" ] && cp "$f" /tmp/bundles/; done < /tmp/changed.txt
          for attempt in 1 2 3; do
            git fetch origin "$BR"
            # checkout -B, NOT reset --soft.
            #
            # `reset --soft` moves HEAD and KEEPS THE INDEX. When this job runs
            # for an hour and the branch moves underneath it, the index still
            # describes the OLD checkout, so committing it against the NEW
            # parent produces a diff that DELETES everything added in between.
            # That is not hypothetical: at 05:35Z this step built
            #
            #   20 files changed, 151 insertions(+), 1411 deletions(-)
            #    delete mode 100644 model/LITERATURE.md
            #    delete mode 100644 model/serve/selfimprove.py
            #
            # under the message "chore(data): harvest cross-asset hourly
            # bundles". It was rejected only because the same revert touched a
            # workflow file and the Actions token has no `workflows` permission
            # -- a check this job was never designed to rely on.
            # -f because the work tree is DIRTY here by design: the job has
            # already written its output, and `checkout -B` refuses to move
            # when tracked files differ from the target. That is exactly what
            # failed at 12:02Z --
            #   error: Your local changes to the following files would be
            #   overwritten by checkout: data/assets/*.parquet ... Aborting
            # The output is already safe in /tmp at this point, so discarding
            # the work tree copy loses nothing and is what makes the re-parent
            # possible.
            git checkout -f -B "$BR" "origin/$BR"
            # REFUSE to publish this run's bundles onto a tip whose HARVESTER
            # has changed.
            #
            # concurrency is cancel-in-progress: false, so if harvest.py is
            # edited while a run is going, the old run finishes, force-checks
            # out the NEW tip and would commit bundles built by the OLD code.
            # If the queued run then fails, those stale -- possibly
            # schema-incompatible -- bundles sit next to the new harvester
            # indefinitely, and nothing in the tree says so.
            #
            # The artifact upload already happened, so nothing is lost by
            # declining: the queued run will produce bundles from the current
            # code, and this run's output stays recoverable from its artifact.
            if ! git diff --quiet "$GITHUB_SHA" HEAD -- model/eval/harvest.py \
                                                        model/serve/fetch.py; then
              echo "REFUSING to commit: the harvester changed between this"
              echo "run's commit ($GITHUB_SHA) and the branch tip. These"
              echo "bundles were built by the older code; the queued run will"
              echo "rebuild them. Output remains in the asset-bundles artifact."
              exit 0
            fi
            while read -r f; do
              [ -n "$f" ] && cp "/tmp/bundles/$(basename "$f")" "$f" 2>/dev/null || true
            done < /tmp/changed.txt
            git add data/assets/
            if git diff --cached --quiet; then
              echo "nothing new to commit"; exit 0
            fi
            # Refuse to push anything but the bundles.
            if git diff --cached --name-only | grep -qv '^data/assets/'; then
              echo "REFUSING: staged files outside data/assets/:"
              git diff --cached --name-only
              exit 1
            fi
            git commit -m "chore(data): harvest cross-asset hourly bundles"
            git push origin "HEAD:$BR" && exit 0
            echo "push attempt $attempt rejected; retrying"
            sleep 5
          done
          echo "could not push after 3 attempts"; exit 1
