# .github/workflows/fetch-data.yml  (v4.1)
# =====================================================================
# Snapshot enrichment cron. Every 30 minutes it:
#   1. Runs the local NOCTUA model             → data/kronos.json + noctua.json
#      (tops up data/noctua_history.parquet from a live 5-min feed; the
#       bundle carries the 365d of history the features need)
#   2. Fetches news (CryptoPanic + GDELT, + Exa if EXA_API_KEY secret set)
#      and Fear & Greed                          → data/news.json, data/fg.json
#   3. Runs the smoke gate (never publish malformed snapshots)
#   4. Commits only if something actually changed
#
# The browser-side data.js prefers these snapshots (tryLoadSnapshot, 45-min
# window) and only falls back to its CORS-proxy chain when they are stale —
# so the free-proxy roulette becomes the backup path, not the primary.
#
# Cost: $0 — GitHub Actions free tier for public repos.
name: fetch-data

on:
  schedule:
    - cron: '*/30 * * * *'     # every 30 min (GH may delay a few minutes)
  workflow_dispatch: {}         # manual run button

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NOCTUA runtime (numpy/scipy only, no torch)
        run: pip install --quiet -r model/serve/requirements-ci.txt

      - name: NOCTUA forecast
        run: python model/serve/predict.py --out-dir data
        continue-on-error: true   # keep the previous forecast on a feed failure

      - name: Fetch news + fear/greed enrichment
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: node scripts/fetch-enrichment.js
        continue-on-error: true

      - name: FinBERT sentiment (HF Inference API)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 scripts/fetch-sentiment.py
        continue-on-error: true   # script also soft-exits without a token

      - name: Smoke-test snapshots
        run: node scripts/smoke.js

      - name: Commit snapshots if changed
        run: |
          git config user.name  "snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json data/*.parquet
          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "chore(data): snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push
          fi
