# .github/workflows/model-ci.yml
# =====================================================================
# Pull-request gate for the NOCTUA model and its serving path.
#
# The data cron (fetch-data.yml) only runs on a schedule, so before this
# workflow existed a change to the serving code was not executed by CI until
# AFTER it merged and the cron picked it up -- i.e. the first thing to notice a
# broken import would have been the live dashboard.
#
# This job exercises everything that does not need market data or the ~160 MB
# training parquet: imports, the exported weights, the NumPy runtime's parity
# with its own monotonicity guarantees, the legacy JSON contract, and the
# existing snapshot smoke gate.
name: model-ci

on:
  pull_request:
    paths:
      - 'model/**'
      - 'data/noctua_history.parquet'
      - 'scripts/**'
      - '.github/workflows/model-ci.yml'
      - '.github/workflows/fetch-data.yml'
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install serving runtime
        run: pip install --quiet -r model/serve/requirements-ci.txt

      - name: Smoke-test existing snapshots
        run: node scripts/smoke.js

      - name: Model self-test
        run: python model/tests/test_serving.py

      - name: History / live-path self-test
        run: python model/tests/test_history.py

      # Guards the causality of the volatility recalibration. A look-ahead
      # leak here would be silent -- the forecasts would simply look better
      # than they are -- so it is gated rather than trusted.
      - name: Adaptive-calibration self-test
        run: python model/tests/test_adaptive.py

      # Gates the online-adaptation guard: ACI's coverage guarantee, Ville's
      # bound on the e-processes, and the promotion/veto asymmetry. A
      # regression in any of these is SILENT -- the system keeps forecasting
      # and keeps reporting that it is safe. The gate-direction check
      # reproduces a bug that shipped once: promotion tested whether the
      # e-process had EVER crossed its threshold, so one early spike unlocked
      # it permanently.
      - name: Self-improvement guard self-test
        run: python model/tests/test_selfimprove.py
