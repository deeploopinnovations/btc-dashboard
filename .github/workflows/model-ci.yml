# .github/workflows/model-ci.yml
# =====================================================================
# Pull-request gate for the NOCTUA model and its serving path.
#
# The data cron (fetch-data.yml) only runs on a schedule, so before this
# workflow existed a change to the serving code was not executed by CI until
# AFTER it merged and the cron picked it up -- i.e. the first thing to notice a
# broken import would have been the live dashboard.
#
# This job exercises everything that does not need market data or the ~160 MB
# training parquet: imports, the exported weights, the NumPy runtime's parity
# with its own monotonicity guarantees, the legacy JSON contract, and the
# existing snapshot smoke gate.
name: model-ci

on:
  pull_request:
    paths:
      - 'model/**'
      - 'data/noctua_history.parquet'
      - 'data/context/**'
      - 'scripts/**'
      - 'src/**'
      - 'index.html'
      - '.github/workflows/model-ci.yml'
      - '.github/workflows/fetch-data.yml'
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install serving runtime
        run: pip install --quiet -r model/serve/requirements-ci.txt

      # FIRST, and cheap. Two live NameErrors sat in the eval suite for 106
      # commits (direction.block_bootstrap_ci, anchor_freshness._verdict),
      # reachable by neither test nor artifact rerun. Every test below executes
      # code; this is the only step that audits code nothing executes.
      - name: Undefined names (ruff F821)
        run: |
          pip install --quiet ruff
          ruff check --no-cache --select F821 model/ scripts/

      - name: Dispersion hook is a bit-identical no-op
        run: python model/tests/test_dispersion_hook.py

      - name: Model self-test
        run: python model/tests/test_serving.py

      # NOCTUA-Trader: the open weights must reproduce the positions the
      # torch ensemble was scored on, stay in bounds, and read no future hour.
      - name: Trading-policy runtime self-test
        run: python model/tests/test_policy_runtime.py

      # Point-in-time context data: every file validates, the as-of join is
      # strict, hindsight labels cannot load as features, and deleting every
      # row published at or after t leaves the features at t unchanged.
      - name: Context dataset point-in-time gate
        run: python model/tests/test_context_pit.py

      - name: History / live-path self-test
        run: python model/tests/test_history.py

      # Guards the causality of the volatility recalibration. A look-ahead
      # leak here would be silent -- the forecasts would simply look better
      # than they are -- so it is gated rather than trusted.
      - name: Adaptive-calibration self-test
        run: python model/tests/test_adaptive.py

      # Gates the separation P2-level-report depends on: the trailing QLIKE
      # scalar multiplies the REPORTED sigma and must never reach the
      # predictive object. P2-scale-v2 and P2-mean-level both moved the level
      # inside the pipeline and degraded all six barrier metrics, and
      # P2-mean-level's SHUFFLED control degraded them by the same amount --
      # so the damage comes from moving the level at all. The test runs the
      # real forecast twice and requires every touch probability, safe level,
      # p_up and p_vol_amplify to be bit-identical, and it exercises its own
      # failure mode so it is not a guard that cannot fail (R2).
      - name: Level-reporting separation gate
        run: python model/tests/test_level_report.py

      # The MIRROR of the gate above, for the correction that does the
      # opposite. The functional choice provably cannot reach the curves;
      # the dispersion correction moves them BY DESIGN, so "safe by
      # construction" is unavailable and the substitute is a written
      # contract asserted field by field: the barrier price GRID, the
      # safe-level confidences and sigma_med may not move, everything that
      # does move must be on the documented list, and the farthest rung on
      # each side must see its probability FALL -- a hook that widened while
      # claiming to narrow passes every equality check and fails that one.
      - name: Dispersion serving contract gate
        run: python model/tests/test_dispersion_report.py

      # Gates the clock-aware anchor (P4-hour-anchor-result): off must publish
      # the clock-blind payload bit for bit, on must move the served median by
      # exactly the anchor algebra through the seed ensemble and never move
      # the barrier grid, and on without the artifact arrays must raise.
      - name: Hour-anchor serving gate
        run: python model/tests/test_hour_anchor.py

      # Pins a known defect (P4-weekend-bug): cal_weekend_frac counts Fri+Sat.
      # The shipped network was trained on it, so an in-place "fix" would be a
      # train/serve skew; checked against pandas' calendar, not the formula.
      - name: Weekend-column pin
        run: python model/tests/test_weekend_column.py

      # Gates the true-weekend anchor increment (P4-weekend-fix-result): off
      # must publish the shipped payload bit for bit, on must move the served
      # median by exactly the increment algebra (Saturday and Monday, alone and
      # on top of the clock-aware anchor), read the TRUE calendar, and never
      # move the barrier grid.
      - name: Weekend-anchor serving gate
        run: python model/tests/test_weekend_anchor.py

      # Gates the day-of-week anchor increment (P4-dow-anchor-result): off is
      # the shipped payload bit for bit, on moves the median by the increment
      # algebra on all seven weekday nights, the fractions are pandas' calendar,
      # and DOW_ANCHOR with WEEKEND_ANCHOR is refused.
      - name: Day-of-week-anchor serving gate
        run: python model/tests/test_dow_anchor.py

      # Gates the next-day implied-vol increment (P4-iv1d-*): off is the shipped
      # payload bit for bit; on at 17:00/H=19 with an implied vol moves the
      # median by exactly a + b*(iv - anchor); elsewhere or without an IV
      # nothing moves; combined with another anchor flag it raises. No network.
      - name: Implied-vol-anchor serving gate
        run: python model/tests/test_iv_anchor.py

      # Gates NOCTUA_DEBUG, the stage-by-stage forecast trace (serve/debug.py):
      # off prints nothing; on prints one record per stage to stderr only; the
      # payload and the written noctua.json are identical on and off; the
      # trace's numbers are the forecast's own; a failing stage is named and
      # re-raised unchanged. Offline, no network.
      - name: Debug-trace serving gate
        run: python model/tests/test_debug_trace.py

      # Gates the online-adaptation guard: ACI's coverage guarantee, Ville's
      # bound on the e-processes, and the promotion/veto asymmetry. A
      # regression in any of these is SILENT -- the system keeps forecasting
      # and keeps reporting that it is safe. The gate-direction check
      # reproduces a bug that shipped once: promotion tested whether the
      # e-process had EVER crossed its threshold, so one early spike unlocked
      # it permanently.
      - name: Self-improvement guard self-test
        run: python model/tests/test_selfimprove.py

      # The forward holdouts measure each candidate against a FROZEN base. A
      # pull request that changes any base array, the metadata, or the served
      # numbers at three fixed anchors would silently move both arms of every
      # pending holdout; it fails here, before it merges, rather than on the
      # daily cron after (Codex review, PR #14). A deliberate change updates
      # BASE_SHA16 with a DATA_USE.md amendment made before any holdout scores.
      - name: Forward holdouts' frozen base intact
        run: python -m model.eval.forward_weekend_anchor --check-base

      # The six forward holdouts are one family (research/DATA_USE.md): each
      # lock must carry its primary's Bonferroni interval (alpha / 6) and the
      # per-night deltas it was built from, so the family can be read without
      # rescoring a spent holdout. The gate shows the correction can change a
      # reading and that a tampered lock is caught.
      - name: Forward-holdout family intervals
        run: python model/tests/test_forward_family.py

      # The paper-trading agent (P5-rl-paper): planted-edge and pure-noise
      # learning, causality, idempotency, outages, out-of-order bars, voids,
      # the atomic two-file Hub commit (against a fake API, no network), and
      # the state round-trip of every hyperparameter.
      - name: RL paper agent
        run: |
          pip install --quiet "huggingface_hub>=1.16"
          python model/tests/test_rl.py

      # The research record is an artifact like any other, and it has been
      # corrupted twice by scripts appending to ledger.json directly instead
      # of through ledger.add() -- two entries with no `topic` (a reader
      # crashed on the missing key months later), a `supersedes` pointing at
      # an id that never existed, and a one-sided supersede link that made
      # --corrections and --open disagree about what was settled. Checking the
      # FILE rather than the write path is the only version of this check that
      # binds.
      - name: Research ledger schema
        run: python -m model.research.ledger --validate

      # The pitfalls suite is a set of guards that were each written after a
      # real defect got through. Its self-test asserts that every one of them
      # can still FAIL -- a guard that has quietly become unfalsifiable is
      # worse than no guard, because it prints reassuring output.
      - name: Pitfall guards can still fail
        run: python -m model.research.pitfalls --self-test

      # Phase 2's record has its own schema -- candidates carry provenance and
      # leakage risk, mechanisms carry a falsifier and a tag the stagnation
      # supervisor counts. Same reason as the ledger above: it is written by
      # scripts, so the FILE is what gets checked.
      - name: Teacher ledger schema
        run: python -m model.research.teacher_ledger --validate

      # The dashboard's forecast panel shows ONE model by design: NOCTUA's
      # snapshot while its 19-hour window is open, aged on every read, else
      # offline -- never the third-party demo it used to scrape whenever the
      # snapshot was over 45 min old (PIPELINE_TRACE.md F4). Runs the real
      # src/data.js in a node sandbox; asserts no demo/proxy request is made.
      - name: Dashboard shows NOCTUA only
        run: node scripts/test-noctua-source.js

      # LAST, DELIBERATELY. This checks the AGE of a committed data snapshot
      # against a 6-hour threshold, so it fails whenever the data cron has not
      # run recently -- for reasons that have nothing to do with the diff under
      # review. It used to run FIRST, and because the job stops at the first
      # failing step, a stale snapshot meant none of the code tests above ever
      # executed: a real regression would have been invisible behind a data
      # freshness failure, reported identically as "test failed".
      #
      # Nothing is weakened. The check still fails the job exactly as before.
      # It runs last so that a code failure is always reported, and so that a
      # red job during a cron gap is unambiguous about which kind of failure
      # it is.
      - name: Smoke-test existing snapshots (data freshness)
        run: node scripts/smoke.js

  # The forward holdouts' one-shot scorers, exercised on ALREADY-SEEN nights
  # (a fake freeze inside the committed bundle, a tiny N_MIN, a temporary
  # lock -- never the holdout): count-only below N_MIN, score-and-lock at it,
  # refuse to rescore, refuse a changed base or candidate, abort (no lock) on
  # an IV fetch error, and write the per-night deltas and family interval.
  # Each holdout scores exactly once, months from now, on the default branch;
  # a mechanics defect found then cannot be fixed without spending it. A
  # separate job so the ~4 minutes run beside the gates above.
  forward-holdout-selftests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install serving runtime
        run: pip install --quiet -r model/serve/requirements-ci.txt

      - name: Forward-holdout scorers' self-tests
        run: |
          set -e
          for m in forward_hour_anchor forward_weekend_anchor forward_dow_anchor forward_clock_dow_anchor forward_iv1d_anchor; do
            echo "=== $m"
            python -m model.eval.$m --selftest
          done
